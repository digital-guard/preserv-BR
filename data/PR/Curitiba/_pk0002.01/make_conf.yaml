layers:
  geoaddress:
        subtype: full
        method: geojson2sql
        file: 1
        # tem que descompactar num_predial_curitiba_201902_distancia_20metros_eixo_rua.rar
        orig_filename: num_predial_curitiba_201902_distancia_20metros_eixo_rua.rar
        orig_subfilename: num_predial_curitiba_201902_distancia_20metros_eixo_rua.geojson
        # geojson2sql carrega jgeom/properties (geojson_readfile_features_jgeom), como em Bage
        sql_view: |-
          SELECT row_number() OVER () AS gid, properties->>'num_pred' AS hnum, \
                 properties->>'logradouro' AS logradouro, jgeom AS geom FROM $(tabname)
        standardized_fields:
         -
          name: num_pred
          standard: hnum
        other_fields:
         -
          name: logradouro
  parcel:
        subtype: full
        method: shp2sql
        file: 2
        orig_filename: LOTES_201902
        sql_select: ['gid', 'NME_LOGRAD AS via', 'NUM_PREDIA AS poiter_number']
        standardized_fields:
         -
          name: NME_LOGRAD
          standard: via
         -
          name: NUM_PREDIA
          standard: poiter_number
